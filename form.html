<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Form</title>

    <!-- ✔ Requerido por la auditoría -->
    <meta name="description" content="Product review form for users to submit installation date, rating, and product features.">
    <meta name="author" content="Saúl Abraham Arana Calderón">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <script src="scripts/getdates.js" defer></script>
</head>

<body>
  <header class="site-header">
    <h1>Product Review</h1>
  </header>

  <main>
    <form id="reviewForm" method="get" action="review.html" novalidate>
      <fieldset class="card">
        <legend class="sr-only">Product review form</legend>

        <label for="product" class="label-required">Product Name</label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>

        <div class="form-row">
          <label class="label-required">Overall Rating</label>
          <div class="rating" role="radiogroup" aria-label="Overall rating">

            <label class="star" for="rating-1">
              <input type="radio" name="rating" id="rating-1" value="1" required>
              <span aria-hidden="true">☆</span>
            </label>

            <label class="star" for="rating-2">
              <input type="radio" name="rating" id="rating-2" value="2" required>
              <span aria-hidden="true">☆☆</span>
            </label>

            <label class="star" for="rating-3">
              <input type="radio" name="rating" id="rating-3" value="3" required>
              <span aria-hidden="true">☆☆☆</span>
            </label>

            <label class="star" for="rating-4">
              <input type="radio" name="rating" id="rating-4" value="4" required>
              <span aria-hidden="true">☆☆☆☆</span>
            </label>

            <label class="star" for="rating-5">
              <input type="radio" name="rating" id="rating-5" value="5" required>
              <span aria-hidden="true">☆☆☆☆☆</span>
            </label>

          </div>
        </div>

        <label for="installDate" class="label-required">Date of Installation</label>
        <input type="date" id="installDate" name="installDate" required>

        <fieldset class="checkbox-group">
          <legend>Which features did you find useful in the product? <em>(Check all that apply)</em></legend>

          <label for="durability">
            <input type="checkbox" id="durability" name="features" value="Durability"> Durability
          </label>

          <label for="ease">
            <input type="checkbox" id="ease" name="features" value="Ease of Use"> Ease of Use
          </label>

          <label for="perf">
            <input type="checkbox" id="perf" name="features" value="Performance"> Performance
          </label>

          <label for="design">
            <input type="checkbox" id="design" name="features" value="Design"> Design
          </label>
        </fieldset>

        <label for="reviewText">Written Review <span class="optional">(Optional)</span></label>
        <textarea id="reviewText" name="reviewText" rows="6" placeholder="Write your review..."></textarea>

        <label for="userName">Your Name <span class="optional">(Optional)</span></label>
        <input type="text" id="userName" name="userName" placeholder="Your name">

        <input type="submit" value="Post Review" class="btn-submit">
      </fieldset>
    </form>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="currentyear"></span> - Saúl Abraham Arana Calderón - Guatemala</p>
    <p id="lastModified"></p>
  </footer>
</body>

</html>
